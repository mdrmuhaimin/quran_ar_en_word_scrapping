<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Learning Game</title>
    <!-- Google Fonts: Amiri -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- SQL.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Quran Learning Game</h1>
        <nav>
            <button id="nav-dashboard" class="nav-btn active">Dashboard</button>
            <button id="nav-browse" class="nav-btn">Browse Words</button>
        </nav>
    </header>

    <main>
        <!-- Loading State -->
        <div id="loading-screen" class="screen">
            <div class="loader"></div>
            <p id="loading-text">Initializing Database...</p>
        </div>

        <!-- Dashboard Screen -->
        <section id="dashboard-screen" class="screen hidden">
            <div class="stats-container">
                <div class="stat-card">
                    <h3>Level</h3>
                    <div id="user-level" class="stat-value">1</div>
                    <div class="xp-bar-container">
                        <div id="xp-bar-fill" class="xp-bar-fill" style="width: 0%"></div>
                    </div>
                    <p id="user-xp" class="stat-sub">0 XP</p>
                </div>
                <div class="stat-card">
                    <h3>Streak</h3>
                    <div id="user-streak" class="stat-value">0</div>
                    <p class="stat-sub">Days</p>
                </div>
                <div class="stat-card">
                    <h3>Mastery</h3>
                    <div id="user-mastery" class="stat-value">0%</div>
                    <p class="stat-sub">of Top 80%</p>
                </div>
            </div>

            <div class="action-area">
                <button id="start-session-btn" class="primary-btn pulse">Start Daily Session</button>
                <p class="session-info">Review 10 words to keep your streak!</p>
            </div>
        </section>

        <!-- Game Screen -->
        <section id="game-screen" class="screen hidden">
            <div class="game-header">
                <span id="session-progress">Word 1/10</span>
                <button id="quit-session" class="text-btn">Quit</button>
            </div>

            <div class="flashcard-container">
                <div id="flashcard" class="flashcard">
                    <div class="flashcard-front">
                        <div id="card-arabic" class="arabic-word">...</div>
                        <p class="tap-hint">(Tap to flip)</p>
                    </div>
                    <div class="flashcard-back">
                        <div id="card-english" class="english-meaning">...</div>
                        <div id="card-stats" class="frequency-count">...</div>
                    </div>
                </div>
            </div>

            <div id="game-controls" class="game-controls hidden">
                <button class="rating-btn hard" data-rating="hard">Hard (+5 XP)</button>
                <button class="rating-btn good" data-rating="good">Good (+10 XP)</button>
                <button class="rating-btn easy" data-rating="easy">Easy (+15 XP)</button>
            </div>
        </section>

        <!-- Browse Screen (Original Features) -->
        <section id="browse-screen" class="screen hidden">
            <div class="browse-controls">
                <div class="control-group">
                    <h3>Global Top 50</h3>
                    <p>Most frequent words excluding particles.</p>
                    <div id="global-deck" class="card-grid"></div>
                </div>

                <div class="control-group">
                    <h3>Surah Filter</h3>
                    <select id="surah-select">
                        <option value="" disabled selected>Choose a Surah...</option>
                    </select>
                    <div id="surah-deck" class="card-grid"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="game_logic.js"></script>
    <script src="db.js"></script>
    <script src="app.js"></script>
</body>
</html>
