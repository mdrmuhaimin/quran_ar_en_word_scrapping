<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Learning Game</title>
    <!-- Google Fonts: Amiri -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- SQL.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="language-control">
            <select id="language-select">
                <option value="en">English</option>
                <option value="bn">বাংলা</option>
            </select>
        </div>
        <h1 data-i18n="header_title">80/20 Quran Vocabulary</h1>
        <p data-i18n="header_subtitle">Master the most frequent words of the Quran.</p>
        <div id="loading" class="loading" data-i18n="loading_text">Loading data...</div>
    </header>

    <main>
        <section id="global-section">
            <h2 data-i18n="global_section_title">High Frequency Deck (Top 50)</h2>
            <p class="subtitle" data-i18n="global_section_subtitle">These words appear most frequently throughout the Quran.</p>
            <div id="global-deck" class="card-grid"></div>
        </section>

        <section id="surah-section">
            <h2 data-i18n="surah_section_title">Surah Specific Prep</h2>
            <div class="controls">
                <label for="surah-select" data-i18n="surah_select_label">Select a Surah:</label>
                <select id="surah-select">
                    <option value="" disabled selected data-i18n="surah_select_default">Choose a Surah...</option>
                </select>
            </div>
            <p class="subtitle" data-i18n="surah_section_subtitle">Top 20 frequent words in the selected Surah.</p>
            <div id="surah-deck" class="card-grid"></div>
        </section>
    </main>

    <script src="game_logic.js"></script>
    <script src="db.js"></script>
    <script src="app.js"></script>
</body>
</html>
